- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Department of Electrical and Computer Engineering, Northeastern University
      location: Massachusetts, USA
      year: 2021–2026
      description:
        - Developed standard-compliant Wi-Fi beamforming-feedback sensing, simultaneous multi-subject sensing, and domain-adaptive sensing frameworks.
        - Designed communication-native ISAC systems at 58 GHz mmWave and 130 GHz sub-THz frequencies.
        - Developed learning-based multi-band CFR fusion, multipath estimation, MIMO feedback analysis, and adaptive channel sounding.
        - Designed sensing-assisted, semantic MU-MIMO, and physical-layer approaches for low-latency wireless edge computing.
        - Developed neural radio fingerprinting with compressed MIMO feedback.
        - Built Wi-BFI, the m3MIMO testbed, WiSEC, and a real-time MU-MIMO Wi-Fi edge-computing testbed.
